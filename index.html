<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Sprint</title>
<style>
:root{
  --bg:#f5f7f8;--card:#fff;--text:#12211b;--muted:#65746e;--line:#dde6e1;
  --green:#1f9d64;--green2:#dff7eb;--navy:#132d46;--blue:#eaf2fb;--warm:#fff3dc;
  --shadow:0 12px 32px rgba(18,33,27,.08);--radius:18px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body.fit{--bg:#f4f4f2;--card:#fff;--text:#111;--muted:#6d6d6d;--line:#dededb;--green:#111;--green2:#efefec;--navy:#111;--blue:#f0f0ee;--warm:#f7f2e8}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:20px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brandWrap{position:relative}
.brand{width:100%;display:grid;grid-template-columns:46px 1fr 18px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:10px;text-align:left}
.brand:hover{box-shadow:var(--shadow)}
.badge{height:42px;width:42px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:850;font-size:13px;letter-spacing:.4px}
.brand strong{display:block;font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.switchMenu{position:absolute;top:62px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:var(--shadow);display:none;z-index:40}
.switchMenu.open{display:block}
.switchMenu button{width:100%;border:0;background:transparent;padding:11px;border-radius:10px;text-align:left}
.switchMenu button:hover{background:var(--blue)}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:20px;overflow:auto;padding-bottom:20px}
.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#405149;font-weight:650}
.nav button.active,.nav button:hover{background:var(--green2);color:var(--text)}
.sideFooter{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted)}
.main{min-width:0;padding:28px 32px 52px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{margin:0;font-size:30px;letter-spacing:-.6px}.kicker{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.mobileMenu{display:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px}
.page{max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 14px rgba(0,0,0,.025);padding:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.metricLabel{font-size:12px;color:var(--muted);font-weight:700}.metric{font-size:28px;font-weight:850;margin-top:6px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
.progress{height:10px;background:#edf1ef;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:inherit}
.hero{padding:24px;background:linear-gradient(135deg,var(--navy),#214f70);color:#fff;border:0}.fit .hero{background:linear-gradient(135deg,#111,#333)}
.hero h2{font-size:28px;margin:8px 0}.hero p{max-width:700px;color:rgba(255,255,255,.8);line-height:1.6}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--green);color:#fff}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#9b2c2c}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--blue);font-size:12px;font-weight:750}
.weekTabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.weekTabs button,.dayChip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:750}.weekTabs button.active,.dayChip.active{background:var(--navy);color:#fff}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.dayChip{text-align:left;min-height:72px}.dayChip small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.dayChip.done{border-color:#75cfa3;background:#eefbf5}.dayChip.done small{color:#287850}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px}.sectionTitle h2,.sectionTitle h3{margin:0}
.lessonNav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.lessonSection{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.lessonSection h3{margin-top:0}.lessonSection p,.lessonSection li{line-height:1.65}.ruleTable{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.ruleTable td,.ruleTable th{border-bottom:1px solid var(--line);padding:9px;text-align:left}
.quizQ{padding:14px 0;border-bottom:1px solid var(--line)}.option{display:block;width:100%;margin:7px 0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:left}.option.correct{border-color:#3aa773;background:#e8f8ef}.option.wrong{border-color:#d56a6a;background:#fff0f0}
.notice{border-left:4px solid var(--green);background:var(--green2);padding:12px 14px;border-radius:10px;font-size:13px}
.tip{border-left:4px solid #d69a2d;background:var(--warm);padding:12px 14px;border-radius:10px;font-size:13px}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}.fit textarea,.fit input{background:#fff}textarea:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}
textarea{min-height:110px;resize:vertical}
.bucketAdd{background:#102019;color:#fff;border-radius:20px;padding:20px}.fit .bucketAdd{background:#111}.bucketAdd input{margin:7px 0}
.wordRow{display:grid;grid-template-columns:1.1fr 1.3fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wordPopup{position:fixed;z-index:100;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 18px 42px rgba(0,0,0,.18);min-width:230px;max-width:320px;display:none}
.wordPopup.show{display:block}.wordPopup strong{font-size:18px}.wordPopup .meaning{color:var(--muted);margin:5px 0 12px}
.spanishZone{cursor:text}
.accordion{border:1px solid var(--line);border-radius:14px;margin:9px 0;background:#fff;overflow:hidden}.accHead{width:100%;display:flex;justify-content:space-between;border:0;background:#fff;padding:13px 14px;font-weight:800}.accBody{display:none;padding:0 14px 14px}.accordion.open .accBody{display:block}
.exercise{padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.exercise strong{display:block}.exercise small{color:var(--muted)}
.toggle{display:inline-flex;background:#ededeb;border-radius:12px;padding:3px}.toggle button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:800}.toggle button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.checkRow{display:grid;grid-template-columns:1fr repeat(4,58px);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.scoreBtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px}.scoreBtn.active{background:var(--navy);color:#fff}
.coverage{width:100%;border-collapse:collapse;font-size:13px}.coverage th,.coverage td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.coverage td:last-child{color:var(--muted)}
.badges{display:flex;gap:10px;flex-wrap:wrap}.milestone{padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff}.milestone.locked{opacity:.45}.milestone.unlocked{border-color:#9a9a96}
.flashcard{min-height:220px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fafcfb);font-size:28px;font-weight:850;padding:30px}
.miniChart{display:flex;align-items:flex-end;gap:8px;height:120px}.bar{flex:1;background:var(--green2);border-radius:7px 7px 2px 2px;position:relative}.bar i{position:absolute;bottom:0;left:0;right:0;background:var(--green);border-radius:inherit}.bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;width:268px;transition:.2s;box-shadow:18px 0 40px rgba(0,0,0,.12)}.sidebar.open{left:0}.mobileMenu{display:block}.main{padding:20px 16px}.c3,.c4,.c5,.c6,.c7,.c8{grid-column:1/-1}.daygrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.daygrid{grid-template-columns:repeat(2,1fr)}.topbar h1{font-size:24px}.wordRow{grid-template-columns:1fr}.main{padding:15px 11px}.card{padding:15px}.checkRow{grid-template-columns:1fr repeat(4,42px)}}

.selectionPanel{
  position:fixed;
  left:286px;
  bottom:22px;
  width:300px;
  z-index:120;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 18px 42px rgba(0,0,0,.16);
  padding:14px;
  display:none;
}
.selectionPanel.show{display:block}
.selectionPanel .selectedWord{font-size:18px;font-weight:850;margin-bottom:5px}
.selectionPanel .selectedMeaning{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:12px}
.selectionPanel .selectionHint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:900px){
  .selectionPanel{left:12px;right:12px;bottom:12px;width:auto}
}

.vocabRevealBox{

}

}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brandWrap">
    <button class="brand" id="brandBtn"><span class="badge" id="brandBadge">B1</span><span><strong id="brandTitle">DELE B1 Sprint</strong><small id="brandSub">beginner → B1 intensive</small></span><span>⌄</span></button>
    <div class="switchMenu" id="switchMenu">
      <button onclick="switchProgram('dele')"><strong>DELE B1 Sprint</strong><small class="sub">beginner → B1 intensive</small></button>
      <button onclick="switchProgram('fitness')"><strong>30-Day Fitness</strong><small class="sub">strength · Pilates · conditioning</small></button>
      
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sideFooter"><strong>Offline-first</strong><br>Progress stays on this device via localStorage.</div>
</aside>
<main class="main">
  <div class="page">
    <div class="topbar"><div><div class="kicker" id="kicker">30-day intensive</div><h1 id="pageTitle">Home</h1></div><button class="mobileMenu" onclick="toggleSidebar()">☰ Menu</button></div>
    <div id="content"></div>
  </div>
</main>
</div>
<div class="wordPopup" id="wordPopup"></div>

<div class="selectionPanel" id="selectionPanel">
  <div class="selectedWord" id="selectedWord"></div>
  <div class="selectedMeaning" id="selectedMeaning"></div>
  <div class="btnrow">
    <button class="btn" id="selectionAddBtn">＋ Add to bucket</button>
    <button class="btn ghost" onclick="hideSelectionPanel()">Close</button>
  </div>
  <div class="selectionHint">Highlight a Spanish word or short phrase anywhere in the DELE app.</div>
</div>


<script src="config.js"></script>
<script>
const KEY='sprint30_state_v5';
const defaultState={
 program:'dele',page:'home',deleDay:1,fitDay:1,fitMode:'gym',deleDone:[],fitDone:[],xp:0,
 mistakes:{Reading:0,Listening:0,Writing:0,Speaking:0,Grammar:0,Vocabulary:0},
 concepts:{'ser vs estar':0,'por vs para':0,'past tense choice':0,'pronouns':0,'subjunctive':0,'prepositions':0,'connectors':0},
 bucket:[],bucketAttempts:0,bucketCorrect:0,teacherScores:[],fitChecks:{},fitLogs:{},quizScores:{},reviewed:{},listenAttempts:{},
 writingDrafts:{},writingHistory:[],activeRecall:{},speakingDrafts:{},speakingHistory:[],guidedAnswers:{}
};

const APP_RESET_VERSION='2026-07-23-reset-1';
if(localStorage.getItem('appResetVersion')!==APP_RESET_VERSION){
  const preserveKeys=['preferredSpanishVoice','preferredSpanishRate','deleAudioRate'];
  const preserved={};
  preserveKeys.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null)preserved[k]=v; });

  localStorage.clear();

  Object.entries(preserved).forEach(([k,v])=>localStorage.setItem(k,v));
  localStorage.setItem('appResetVersion',APP_RESET_VERSION);
}

let state=Object.assign({},defaultState,JSON.parse(localStorage.getItem(KEY)||'{}'));

state.mistakes=Object.assign({},defaultState.mistakes,state.mistakes||{});
state.concepts=Object.assign({},defaultState.concepts,state.concepts||{});

const grammarNotes={
1:{rules:['Spanish has five stable vowels: a, e, i, o, u.','Subject pronouns are often omitted because the verb ending shows the subject.','Use tú for informal singular and usted for formal singular.','Ser identifies and classifies: Soy estudiante.','Questions use ¿ ? and exclamations use ¡ !.'],table:[['yo','soy'],['tú','eres'],['él/ella/usted','es'],['nosotros/as','somos'],['ellos/ellas/ustedes','son']],mistake:'Do not translate “I am” word-for-word in every context. Ser is mainly identity/classification; estar arrives on Day 6.'},
2:{rules:['Most nouns ending -o are masculine and -a feminine, but there are exceptions.','Use el/la for “the” and un/una for “a/an”.','Plural: vowel + s; consonant + es.','Adjectives usually agree in gender and number.','Hay means “there is/there are” and does not change for plural.'],table:[['el libro','los libros'],['la casa','las casas'],['un chico simpático','una chica simpática']],mistake:'Use hay una mesa, not “hay está una mesa.”'},
3:{rules:['Age uses tener: Tengo veintidós años.','Time usually uses ser: Es la una / Son las dos.','Dates: Hoy es el 23 de julio.','Question words often carry accents: qué, cuál, cómo, dónde, cuándo, cuánto, quién.','Prices commonly use costar: ¿Cuánto cuesta?'],table:[['¿Qué?','what'],['¿Dónde?','where'],['¿Cuándo?','when'],['¿Cuánto?','how much'],['¿Por qué?','why']],mistake:'Do not say soy 22 años; say tengo 22 años.'},
4:{rules:['-AR: o, as, a, amos, áis, an.','-ER: o, es, e, emos, éis, en.','-IR: o, es, e, imos, ís, en.','Negation normally puts no before the conjugated verb.','Basic order is flexible, but Subject + Verb + Object is a safe beginner pattern.'],table:[['hablar','hablo, hablas, habla, hablamos, habláis, hablan'],['comer','como, comes, come, comemos, coméis, comen'],['vivir','vivo, vives, vive, vivimos, vivís, viven']],mistake:'Never leave an infinitive after a subject when you need a present-tense verb: yo hablo, not yo hablar.'},
5:{rules:['Ir: voy, vas, va, vamos, vais, van.','Tener: tengo, tienes, tiene, tenemos, tenéis, tienen.','Poder and querer are stem-changing except nosotros/vosotros.','Gustar agrees with what is liked: Me gusta el libro / Me gustan los libros.','Decir has digo in the yo form.'],table:[['hacer','hago, haces, hace...'],['venir','vengo, vienes, viene...'],['poder','puedo, puedes, puede...'],['querer','quiero, quieres, quiere...']],mistake:'With gustar, the liked thing controls gusta/gustan.'},
6:{rules:['Ser: identity, origin, profession, defining characteristics, time.','Estar: location, temporary state, resulting condition.','Hay: existence of an indefinite thing.','Use estar + definite noun for location: La estación está aquí.','Use hay + indefinite noun: Hay una estación cerca.'],table:[['Es médico.','He is a doctor.'],['Está cansado.','He is tired.'],['Hay un banco.','There is a bank.']],mistake:'Hay does not take a definite article in the common beginner pattern: hay un problema, but el problema está aquí.'},
8:{rules:['Reflexive verbs use me, te, se, nos, os, se.','The reflexive pronoun comes before a conjugated verb.','With an infinitive it may attach: Voy a ducharme.','Routine verbs: levantarse, ducharse, vestirse, acostarse.','Use primero, después, luego, finalmente to sequence routines.'],table:[['me levanto','I get up'],['te duchas','you shower'],['se acuesta','he/she goes to bed']],mistake:'Do not omit the reflexive pronoun when the verb is reflexive.'},
9:{rules:['ir a + infinitive = near future plan.','tener que + infinitive = personal obligation.','hay que + infinitive = general obligation.','deber + infinitive = should/must depending context.','soler + infinitive = usually do.'],table:[['Voy a estudiar.','I am going to study.'],['Tengo que trabajar.','I have to work.'],['Hay que reservar.','One must reserve.']],mistake:'Conjugate only the first verb: tengo que estudiar, not tengo que estudio.'},
10:{rules:['Pretérito perfecto = haber present + past participle.','he, has, ha, hemos, habéis, han.','-ar → -ado; -er/-ir → -ido.','Common irregular participles: hecho, dicho, visto, puesto, escrito, vuelto.','Useful with unfinished time frames: hoy, esta semana, este año.'],table:[['he hablado','I have spoken'],['has comido','you have eaten'],['hemos vivido','we have lived']],mistake:'Do not split haber and participle with no: No he comido.'},
11:{rules:['Indefinido reports completed past events in a finished time frame.','-AR: é, aste, ó, amos, asteis, aron.','-ER/-IR: í, iste, ió, imos, isteis, ieron.','Common irregulars: fui, tuve, hice, pude, quise, vine, dije.','Time markers: ayer, anoche, el año pasado, en 2024.'],table:[['hablé','I spoke'],['comiste','you ate'],['vivieron','they lived']],mistake:'Watch fui: it can mean “I went” (ir) or “I was” (ser); context decides.'},
12:{rules:['Imperfecto gives background, repeated past habits, ongoing descriptions.','-AR: aba, abas, aba, ábamos, abais, aban.','-ER/-IR: ía, ías, ía, íamos, íais, ían.','Only three core irregulars: era, iba, veía.','Often appears with de pequeño/a, antes, siempre, mientras.'],table:[['jugaba','I used to play'],['comíamos','we were eating/used to eat'],['era','was/used to be']],mistake:'Do not use imperfecto automatically for every past event; completed bounded events often need indefinido.'},
13:{rules:['Perfecto connects past to a current time frame.','Indefinido advances the main completed event line.','Imperfecto paints background, habits and ongoing states.','A common pattern: Mientras + imperfecto, indefinido event.','Ask: Is the time frame finished? Is it background or main event?'],table:[['Esta semana he trabajado mucho.','unfinished frame'],['Ayer trabajé mucho.','finished event'],['Antes trabajaba los sábados.','habit']],mistake:'Choose by meaning and time frame, not by English tense alone.'},
15:{rules:['Direct object pronouns: me, te, lo/la, nos, os, los/las.','They replace the thing/person directly receiving the action.','Place before a conjugated verb: Lo compro.','Attach to infinitive: Voy a comprarlo.','Past participle agreement is not required with haber in standard Spanish.'],table:[['Veo la película.','La veo.'],['Compro los libros.','Los compro.']],mistake:'Match lo/la/los/las to the noun replaced.'},
16:{rules:['Indirect objects answer to/for whom: me, te, le, nos, os, les.','When le/les appears before lo/la/los/las, change le/les to se.','Order: indirect + direct: Te lo doy.','With infinitive: Voy a dártelo.','Accent marks may be added when pronouns attach.'],table:[['Le doy el libro.','I give him/her the book.'],['Se lo doy.','I give it to him/her.'],['Me la explica.','He/she explains it to me.']],mistake:'Never say le lo; use se lo.'},
17:{rules:['a often marks destination and personal direct objects.','de often marks origin/possession/material.','en marks location or means of transport in many phrases.','por often gives cause, route, exchange, duration.','para often gives purpose, destination, recipient or deadline.'],table:[['Voy a Madrid.','destination'],['Trabajo por dinero.','cause/exchange'],['Estudio para aprender.','purpose']],mistake:'Por and para are meaning-based; memorize chunks and ask “cause/process” vs “goal/destination”.'},
18:{rules:['más + adjective + que = more ... than.','menos + adjective + que = less ... than.','tan + adjective + como = as ... as.','el/la más + adjective = the most.','Photo language: en primer plano, al fondo, a la derecha, parece que.'],table:[['más alto que','taller than'],['tan rápido como','as fast as'],['la más interesante','the most interesting']],mistake:'Use mejor/peor rather than más bueno/más malo in standard comparisons.'},
19:{rules:['Gerund: -ar → -ando; -er/-ir → -iendo.','estar + gerundio = action in progress.','seguir + gerundio = continue doing.','Irregular gerunds include leyendo, durmiendo, pidiendo.','Do not use the gerund as an English-style noun.'],table:[['Estoy estudiando.','I am studying.'],['Sigue trabajando.','He/she keeps working.']],mistake:'For “I like swimming,” say Me gusta nadar, not Me gusta nadando.'},
20:{rules:['Affirmative tú often uses the 3rd-person singular present form: habla, come, vive.','Negative tú uses present subjunctive: no hables, no comas, no vivas.','Affirmative commands attach pronouns: dímelo.','Negative commands place pronouns before: no me lo digas.','Polite usted requests use subjunctive forms.'],table:[['Habla.','Speak.'],['No hables.','Do not speak.'],['Dígamelo, por favor.','Tell me, please.']],mistake:'Pronoun placement changes between affirmative and negative commands.'},
22:{rules:['Present subjunctive starts from the yo present: hablo → habl- → hable.','Swap endings: -AR uses e/es/e/emos/éis/en; -ER/-IR uses a/as/a/amos/áis/an.','Use after wishes: Quiero que vengas.','Use after recommendations: Recomiendo que estudies.','Use after emotions/judgments: Me alegra que estés aquí.'],table:[['hablar','hable, hables, hable...'],['comer','coma, comas, coma...'],['vivir','viva, vivas, viva...']],mistake:'Subjunctive is not “the doubt tense”; it is triggered by specific meanings and structures.'},
23:{rules:['Cuando + future reference usually takes subjunctive: Cuando llegue, te llamo.','Para que + subjunctive expresses purpose with a different subject.','Doubt/denial can trigger subjunctive: No creo que sea verdad.','Possibility: Es posible que llueva.','Non-specific/unknown nouns: Busco un piso que tenga terraza.'],table:[['cuando llegue','when I arrive (future)'],['para que entiendas','so that you understand'],['que tenga terraza','that has a terrace (non-specific)']],mistake:'With a known specific noun, indicative is common: Tengo un piso que tiene terraza.'},
24:{rules:['Simple future uses infinitive + é, ás, á, emos, éis, án.','Common irregular stems: tendr-, podr-, har-, dir-, vendr-, querr-, saldr-.','Conditional uses infinitive + ía, ías, ía, íamos, íais, ían.','Conditional is useful for polite requests: ¿Podría ayudarme?','It also expresses hypothetical results.'],table:[['hablaré','I will speak'],['tendremos','we will have'],['podría','I could/would be able to']],mistake:'Do not confuse ir a + infinitive (near plan) with simple future (prediction/less immediate future).'},
25:{rules:['que is the most common relative pronoun.','donde refers to place.','quien/quienes usually refers to people, often after a preposition or comma.','lo que means “what/that which.”','Pronunciation cleanup: keep vowels clear, tap single r, trill rr when possible, and distinguish stress.'],table:[['La casa que vi...','The house that I saw...'],['El lugar donde vivo...','The place where I live...'],['Lo que necesito...','What I need...']],mistake:'Do not overuse quien where que is simpler and more natural.'},
26:{rules:['Build paragraphs around one clear idea.','Use connectors: primero, además, sin embargo, por eso, finalmente.','Accent marks can distinguish meaning: sí/si, tú/tu, él/el, qué/que.','Use opening, development and closing appropriate to genre.','Reserve 5–8 minutes to edit task fulfillment, verbs, agreement, accents and punctuation.'],table:[['además','addition'],['sin embargo','contrast'],['por eso','result'],['por un lado... por otro','organization']],mistake:'A longer answer is not automatically better; answer every bullet and stay within the task’s expected range.'},
27:{rules:['First listen: identify situation, speakers, purpose and general message.','Second listen: confirm detail and eliminate distractors.','Listen closely for numbers, dates, negation and contrast markers.','Attitude is often signaled by tone and words like bueno, claro, la verdad, sin embargo.','Do not panic over unknown words; keep tracking the message.'],table:[['pero/sin embargo','contrast'],['por eso/así que','result'],['primero/luego','sequence']],mistake:'Do not choose an answer merely because it repeats a word from the audio; meaning may be contradicted.'}

function repairHistoryBuckets(){
  state.writingHistory=Array.isArray(state.writingHistory)?state.writingHistory:[];
  state.speakingHistory=Array.isArray(state.speakingHistory)?state.speakingHistory:[];

  const writing=[];
  const speaking=[];

  [...state.writingHistory,...state.speakingHistory].forEach(item=>{
    if(!item||typeof item!=='object')return;

    const isWriting =
      item.type==='writing' ||
      Object.prototype.hasOwnProperty.call(item,'answer');

    const isSpeaking =
      item.type==='speaking' ||
      Object.prototype.hasOwnProperty.call(item,'transcript');

    if(isWriting && !isSpeaking){
      writing.push({...item,type:'writing'});
    }else if(isSpeaking && !isWriting){
      speaking.push({...item,type:'speaking'});
    }else if(item.answer && !item.transcript){
      writing.push({...item,type:'writing'});
    }else if(item.transcript){
      speaking.push({...item,type:'speaking'});
    }
  });

  const dedupe = arr => {
    const seen=new Set();
    return arr.filter(x=>{
      const key=String(x.id||'')+'|'+String(x.day||'')+'|'+String(x.answer||x.transcript||'');
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    });
  };

  state.writingHistory=dedupe(writing);
  state.speakingHistory=dedupe(speaking);
}

function normalizeGuidedAnswer(value){
 return String(value||'')
  .toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[¿?¡!.,;:()"'’]/g,' ')
  .replace(/\s+/g,' ')
  .trim();
}

function checkGuidedAnswers(d){
 const data=dayPracticeData[d-1];
 let score=0;
 data.guidedQuestions.forEach((q,i)=>{
   const key='q'+(i+1);
   const raw=document.getElementById(`guidedQ${i+1}-${d}`)?.value||'';
   saveGuidedField(d,key,raw);
   const value=normalizeGuidedAnswer(raw);
   const accepted=data.guidedAnswers[i]||[];
   const ok=accepted.some(a=>{
     const target=normalizeGuidedAnswer(a);
     return value===target || (target.length>3 && value.includes(target));
   });
   if(ok)score++;
   setGuidedFeedback(
     `guidedQ${i+1}Feedback-${d}`,
     ok,
     ok?'Correct.':'Try again. Re-read the sentence that contains the answer.'
   );
 });
 const summary=`<strong>${score}/4 correct</strong>${score===4?' · Excellent.':' · Fix the red answers and check again.'}`;
 const summaryEl=document.getElementById('guidedSummary-'+d);
 if(summaryEl)summaryEl.innerHTML=summary;

 state.guidedAnswers[d].readingScore=score;
 save();
}

let dailyListeningUtterance=null;

function spanishBrowserVoice(){
 const voices=window.speechSynthesis?.getVoices?.()||[];
 return voices.find(v=>/^es[-_]/i.test(v.lang)&&/Spain|España|Spanish/i.test(v.name))
     || voices.find(v=>/^es[-_]/i.test(v.lang))
     || null;
}

function playDailyListening(d){
 const data=dayPracticeData[d-1];
 if(!data||!data.listeningText)return;
 stopDailyListening();

 if(!('speechSynthesis' in window)){
   const status=document.getElementById('audioStatus-'+d);
   if(status)status.textContent='Browser speech audio is not supported here.';
   return;
 }

 const u=new SpeechSynthesisUtterance(data.listeningText);
 u.lang='es-ES';
 u.rate=dailyListeningRate;
 const voice=spanishBrowserVoice();
 if(voice)u.voice=voice;

 dailyListeningUtterance=u;
 state.listenAttempts[d]=(state.listenAttempts[d]||0)+1;
 save();

 const status=document.getElementById('audioStatus-'+d);
 u.onstart=()=>{if(status)status.textContent=`Playing Day ${d} audio at ${dailyListeningRate}×…`;};
 u.onend=()=>{if(status)status.textContent='Finished. Replay before revealing the transcript.';dailyListeningUtterance=null;};
 u.onerror=()=>{if(status)status.textContent='Audio playback failed. Try Chrome or Safari with a Spanish system voice enabled.';dailyListeningUtterance=null;};

 window.speechSynthesis.speak(u);
}

let activeAudio=null;
let lastAudioSrc='';

function playBundledClip(index,d){
 const clip=bundledListeningClips[index];
 if(!clip||!clip.dataUri){
   const status=document.getElementById('audioStatus-'+d);
   if(status)status.textContent='Embedded audio was not found.';
   return;

function playBundledAudio(src,d){
 stopListeningAudio();
 state.listenAttempts[d]=(state.listenAttempts[d]||0)+1;
 save();

 lastAudioSrc=src;
 lastAudioDay=d;

 const status=document.getElementById('audioStatus-'+d);
 if(status)status.textContent='Loading embedded audio…'; console.log('Loading listening clip',d);

 const a=document.createElement('audio');
 activeAudio=a;
 a.preload='auto';
 a.volume=1;
 a.src=src;

 a.onloadeddata=()=>{if(status)status.textContent='Audio ready.';};
 a.onplaying=()=>{if(status)status.textContent='Playing…';};
 a.onended=()=>{
   if(status)status.textContent='Finished.';
   if(activeAudio===a)activeAudio=null;
 };
 a.onerror=()=>{
   if(status)status.textContent='This browser could not decode the embedded audio.';
   console.error('Embedded audio error',a.error);
   activeAudio=null;
 };

 try{
   const p=a.play();
   if(p&&typeof p.catch==='function'){
     p.catch(err=>{
       console.warn('Audio play failed',err);
       if(status)status.textContent='Playback was blocked. Click Play audio once more.';
     });
   }
 }catch(err){
   console.warn('Audio play failed',err);
   if(status)status.textContent='Playback failed: '+err.message;
 }
}
function replayBundledAudio(){
 if(!lastAudioSrc || !lastAudioDay){
   alert('Play the listening audio once first.');
   return;
 }
 playBundledAudio(lastAudioSrc,lastAudioDay);
}

let activeUtterance=null;
function speakText(txt,d){
 state.listenAttempts[d]=(state.listenAttempts[d]||0)+1;save();
 if(!('speechSynthesis' in window)){alert('Speech synthesis is not supported in this browser. Try Chrome or Safari.');return;}
 speechSynthesis.cancel();
 const play=()=>{
   const voices=speechSynthesis.getVoices();
   const esVoice=voices.find(v=>/^es(-|_)/i.test(v.lang)&&/Spain|España|Monica|Paulina|Jorge/i.test(v.name))
     || voices.find(v=>/^es(-|_)/i.test(v.lang)) || null;
   const u=new SpeechSynthesisUtterance(txt);
   u.lang=esVoice?esVoice.lang:'es-ES';
   if(esVoice)u.voice=esVoice;
   u.rate=.72;u.pitch=1;u.volume=1;
   activeUtterance=u;
   u.onerror=e=>console.warn('Speech synthesis error',e);
   speechSynthesis.speak(u);
 };
 if(speechSynthesis.getVoices().length)play();
 else{
   let fired=false;
   const once=()=>{if(fired)return;fired=true;speechSynthesis.onvoiceschanged=null;play()};
   speechSynthesis.onvoiceschanged=once;
   setTimeout(once,400);
 }
}
function stopListeningAudio(){
 if(activeAudio){
   try{activeAudio.pause();activeAudio.currentTime=0}catch(e){}
   activeAudio=null;
 }
 if('speechSynthesis' in window)speechSynthesis.cancel();
 activeUtterance=null;
}

function saveWritingDraft(d,text){state.writingDrafts[d]=text;save();}
function localWritingAssessment(text){
 const words=(text.trim().match(/\S+/g)||[]);
 const n=words.length;
 const connectors=(text.match(/\b(además|pero|porque|por eso|sin embargo|finalmente|primero|después|aunque|también|entonces)\b/gi)||[]);
 const sentences=(text.match(/[.!?]+/g)||[]).length;
 let score=clamp(Math.round((Math.min(n,100)/100)*50+Math.min(connectors.length,4)*8+Math.min(sentences,4)*4+10),10,95);
 const notes=[];
 if(n<80)notes.push('Develop the response more: the target is 80–110 words.');
 if(n>110)notes.push('Edit for concision: the target is 80–110 words.');
 if(connectors.length<2)notes.push('Add at least two connectors such as porque, además, pero, por eso, or sin embargo.');
 if(sentences<3)notes.push('Use clearer sentence boundaries so the response is easier to follow.');
 if(!/[¿¡áéíóúñ]/i.test(text))notes.push('Check Spanish accents and punctuation carefully.');
 if(!notes.length)notes.push('Good basic structure. Focus next on accuracy, richer vocabulary, and natural phrasing.');
 return {score,notes};
}

${dayPracticeData[d-1].writingPrompt}

Student answer:
${text}

Give helpful B1-level feedback. Use exactly these headings:
TASK COMPLETION:
GRAMMAR:
VOCABULARY:
COHERENCE:
TOP 3 CORRECTIONS:
IMPROVED VERSION:

Be encouraging but specific. For TOP 3 CORRECTIONS, show original → corrected and briefly explain why. Keep the improved version close to the student's ideas and at B1 level. Do not over-correct into advanced Spanish.`;
 let feedback=await callAI(

 );

Estimated practice score: ${local.score}%. ${local.notes[0]||'The task is addressed.'}

Review verb agreement, tense consistency, articles, and adjective agreement.

${local.notes.find(x=>x.includes('connector'))||'Use connectors to link ideas naturally.'}

TOP 3 CORRECTIONS:
Detailed Groq corrections were unavailable, but your answer was still saved.

IMPROVED VERSION:
Submit again when Groq is available for a corrected version.`;
 }
 const attempt={
   id:Date.now(),type:'writing',day:d,date:new Date().toISOString(),dateLabel:new Date().toLocaleString(),
   task:dayPracticeData[d-1].writingPrompt,
   answer:text,words:(text.match(/\S+/g)||[]).length,score:local.score,feedback
 };
 state.writingHistory.push(attempt);
 state.quizScores.writing=local.score;
 if(attempt.words<70)state.mistakes.Writing++;
 save();
 if(out)out.innerHTML=`<div class="feedbackScore">Saved attempt · Practice score <strong>${local.score}%</strong></div><div class="feedbackContent">${formatFeedback(feedback)}</div>`;
}

 r.onerror=e=>{if(status){status.className='sub';status.textContent='Recording error: '+e.error;}};

function escapeHTML(value){
 return String(value)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');
}

async function showVocabWordFromButton(btn){
 const word=btn.dataset.word||'';
 const meaning=btn.dataset.meaning||'';

 // Immediate visible reveal.
 btn.textContent=word+' → '+meaning;
 btn.classList.add('revealed');

 const section=btn.closest('.lessonSection');

 const textEl=box ? box.querySelector('.vocabRevealText') : null;
 const actions=box ? box.querySelector('.vocabRevealActions') : null;
 const addBtn=box ? box.querySelector('.vocabRevealAdd') : null;

 if(textEl)textEl.innerHTML=`<strong>${escapeHTML(word)}</strong> = ${escapeHTML(meaning)}`;
 if(actions)actions.style.display='flex';

 const exists=state.bucket.some(x=>x.es.toLowerCase()===word.toLowerCase());
 if(addBtn){
   addBtn.classList.toggle('added',exists);
   addBtn.textContent=exists?'✓ Already in bucket':'＋ Add to bucket';
   addBtn.onclick=()=>quickAdd(word,meaning,addBtn);
 }

 // Also populate the floating Word Bucket panel.
 const panel=document.getElementById('selectionPanel');
 const wordEl=document.getElementById('selectedWord');
 const meaningEl=document.getElementById('selectedMeaning');
 const sideAdd=document.getElementById('selectionAddBtn');

 if(panel&&wordEl&&meaningEl&&sideAdd){
   wordEl.textContent=word;
   meaningEl.textContent=meaning;
   panel.classList.add('show');
   sideAdd.classList.toggle('added',exists);
   sideAdd.textContent=exists?'✓ Already in bucket':'＋ Add to bucket';
   sideAdd.disabled=false;
   sideAdd.onclick=()=>quickAdd(word,meaning,sideAdd);
 }

 // Groq is optional enrichment only; it can never block the reveal.
 try{
   const groqMeaning=await aiTranslate(word);
   if(groqMeaning){
     btn.textContent=word+' → '+groqMeaning;
     if(textEl)textEl.innerHTML=`<strong>${escapeHTML(word)}</strong> = ${escapeHTML(groqMeaning)}`;
     if(meaningEl)meaningEl.textContent=groqMeaning;
     if(addBtn)addBtn.onclick=()=>quickAdd(word,groqMeaning,addBtn);
     if(sideAdd)sideAdd.onclick=()=>quickAdd(word,groqMeaning,sideAdd);
   }
 }catch(e){}
}

function startSpeakingRecording(d){
 speakingRecordingDay=d;
 const status=document.getElementById('recordingStatus-'+d);
 const box=document.getElementById('speak-'+d);

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   if(status)status.textContent='Speech recognition is not available in this browser. Type your response in the box instead.';
   if(box)box.focus();
   return;
 }

 try{
   if(speakingRecognition) speakingRecognition.stop();
 }catch(e){}

 const rec=new SR();
 speakingRecognition=rec;
 rec.lang='es-ES';
 rec.continuous=true;
 rec.interimResults=true;

 let finalText=(state.speakingDrafts[d]||'').trim();
 let interim='';

 rec.onstart=()=>{
   if(status)status.textContent='● Recording in Spanish… speak naturally.';
   if(status)status.classList.add('recording');
 };

 rec.onresult=(event)=>{
   interim='';
   for(let i=event.resultIndex;i<event.results.length;i++){
     const t=event.results[i][0].transcript;
     if(event.results[i].isFinal){
       finalText+=(finalText?' ':'')+t.trim();
     }else{
       interim+=t;
     }
   }
   if(box){
     box.value=(finalText+(interim?' '+interim:'')).trim();
     state.speakingDrafts[d]=box.value;
     save();
   }
 };

 rec.onerror=(event)=>{
   if(status)status.textContent='Recording stopped. You can edit the transcript manually.';
   if(status)status.classList.remove('recording');
   console.warn('Speech recognition:',event.error);
 };

 rec.onend=()=>{
   if(box){
     state.speakingDrafts[d]=box.value;
     save();
   }
   if(status)status.textContent='Recording stopped. Review the transcript, then save it for feedback.';
   if(status)status.classList.remove('recording');
   speakingRecognition=null;
 };

 try{rec.start();}
 catch(e){
   if(status)status.textContent='Could not start recording. Type your response instead.';
 }
}

function stopSpeakingRecording(){
 if(speakingRecognition){
   try{speakingRecognition.stop();}catch(e){}
 }
}

function localSpeakingAssessment(text){
 const words=(text.trim().match(/\S+/g)||[]);
 const n=words.length;
 const connectors=(text.match(/\b(además|pero|porque|por eso|sin embargo|primero|después|aunque|también|entonces|finalmente)\b/gi)||[]);
 const opinion=(text.match(/\b(creo que|pienso que|en mi opinión|para mí|prefiero|me parece)\b/gi)||[]);
 let score=clamp(Math.round(Math.min(n,90)/90*55 + Math.min(connectors.length,4)*7 + Math.min(opinion.length,2)*6 + 5),10,95);
 const notes=[];
 if(n<35)notes.push('Develop the answer more so you can demonstrate a wider range of B1 language.');
 if(connectors.length<2)notes.push('Use more connectors to organize the response naturally.');
 if(opinion.length<1)notes.push('Add a clear opinion or reaction when the task allows it.');
 if(!notes.length)notes.push('Good amount of language. Focus next on accuracy, natural phrasing, and smoother linking.');
 return {score,notes};
}

function normalizeWord(w){return w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'')}
function lookup(raw){
 let w=raw.toLowerCase().replace(/^[^\p{L}áéíóúüñ]+|[^\p{L}áéíóúüñ]+$/gu,'');
 if(dictionary[w])return dictionary[w];
 let plain=normalizeWord(w);for(let [k,v] of Object.entries(dictionary))if(normalizeWord(k)===plain)return v;
 if(w.endsWith('s')&&dictionary[w.slice(0,-1)])return dictionary[w.slice(0,-1)]+' (plural form)';
 if(w.endsWith('es')&&dictionary[w.slice(0,-2)])return dictionary[w.slice(0,-2)]+' (plural form)';
 if(w.endsWith('a')&&dictionary[w.slice(0,-1)+'o'])return dictionary[w.slice(0,-1)+'o']+' (feminine form)';
 if(w.endsWith('as')&&dictionary[w.slice(0,-2)+'o'])return dictionary[w.slice(0,-2)+'o']+' (feminine/plural form)';
 const reg=[['ando','ar','present participle of '],['iendo','er','present participle of '],['ado','ar','past participle of '],['ido','er','past participle of '],['amos','ar','we-form of '],['emos','er','we-form of '],['imos','ir','we-form of ']];
 for(let [end,inf,prefix] of reg)if(w.endsWith(end)){let root=w.slice(0,-end.length)+inf;if(dictionary[root])return prefix+root+' · '+dictionary[root]}
 return '';
}
function bindSpanishClicks(){
 // Selection lookup never captures normal clicks, so quiz answers remain fully clickable.
 if(window.__selectionLookupBound)return;
 window.__selectionLookupBound=true;
 document.addEventListener('selectionchange',()=>{
   clearTimeout(window.__selectionLookupTimer);
   window.__selectionLookupTimer=setTimeout(()=>{
     const sel=window.getSelection ? window.getSelection() : null;
     const text=sel ? sel.toString().trim() : '';
     if(!text || text.length>80 || !sel.rangeCount)return;
     const range=sel.getRangeAt(0);
     const node=range.commonAncestorContainer.nodeType===3
       ? range.commonAncestorContainer.parentElement
       : range.commonAncestorContainer;
     const zone=node && node.closest ? node.closest('.spanishZone') : null;
     if(zone)showSelectionPanel(text);
   },70);
 });
}
async function showSelectionPanel(text){
 const panel=document.getElementById('selectionPanel');
 const wordEl=document.getElementById('selectedWord');
 const meaningEl=document.getElementById('selectedMeaning');
 const add=document.getElementById('selectionAddBtn');

 wordEl.textContent=text;
 meaningEl.textContent='Translating with Groq…';
 add.classList.remove('added');
 add.textContent='＋ Add to bucket';
 add.disabled=true;
 panel.classList.add('show');

 // Groq is the primary translator. The offline dictionary is only a fallback.
 let meaning='';
 try{
   meaning=await aiTranslate(text);
 }catch(e){
   meaning='';
 }

 if(!meaning){
   meaning=lookupPhraseOrWord(text) || 'Meaning not found.';
   meaningEl.textContent=meaning+' · offline fallback';
 }else{
   meaningEl.textContent=meaning;
 }

 add.disabled=false;
 const exists=state.bucket.some(x=>x.es.toLowerCase()===text.toLowerCase());
 add.classList.toggle('added',exists);
 add.textContent=exists?'✓ Already in bucket':'＋ Add to bucket';

 const aiBtn=document.getElementById('selectionAiBtn');
 if(aiBtn)aiBtn.style.display='none';
}

function lookupPhraseOrWord(text){
 const raw=text.trim().toLowerCase().replace(/^[^\p{L}áéíóúüñ]+|[^\p{L}áéíóúüñ]+$/gu,'');
 if(dictionary[raw]) return dictionary[raw];

 const simple=raw.replace(/[¿?¡!.,;:]+$/g,'').trim();
 if(dictionary[simple]) return dictionary[simple];

 if(!/\s/.test(simple)) return lookup(simple);

 const parts=simple.split(/\s+/);
 const glosses=parts.map(w=>({w,m:lookup(w)})).filter(x=>x.m);
 if(glosses.length===parts.length && glosses.length<=6){
   return glosses.map(x=>`${x.w} = ${x.m}`).join(' · ');
 }
 return '';
}

 save();

 }
}


async function callAI(systemPrompt,userPrompt){
 const cfg=window.APP_CONFIG||{};
 const endpoint=(cfg.GROQ_ENDPOINT||'/api/groq').trim();

 try{
   const r=await fetch(endpoint,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({systemPrompt,userPrompt})
   });

   const data=await r.json().catch(()=>({}));

   if(!r.ok){
     const message=(data&&data.error)||('AI request failed with status '+r.status);
     throw new Error(message);
   }

   return String(data.content||'').trim();
 }catch(err){
   alert('AI request failed: '+err.message);
   return '';
 }
}

async function aiTranslate(text){
 const cleaned=String(text||'').trim();
 if(!cleaned)return '';
 return await callAI(
   'Translate Spanish to concise natural English. Return only the English meaning, with no quotation marks or extra commentary.',
   cleaned
 );
}

 box.innerHTML='<div class="card">'+lines.map(x=>`<p>${x}</p>`).join('')+'</div>';
}

function nutritionCard(t,arr){return `<div class="card c6"><h3>${t}</h3>${arr.map(x=>`<p>✓ ${x}</p>`).join('')}</div>`}
function fitProgress(){
 let c=state.fitDone.length,pc=pct(c,30);let checks=Object.values(state.fitChecks),avg=k=>checks.length?(checks.reduce((a,x)=>a+(x[k]||0),0)/checks.length).toFixed(1):'—';
 return `<div class="grid"><div class="card c12"><div class="sectionTitle"><h3>Progress controls</h3></div><button class="btn ghost" onclick="resetAllProgress()">Reset all progress to 0</button></div>${metric('Completion',pc+'%',`${c}/30 workouts`)}${metric('Streak',streak(state.fitDone)+' days','Sequential workouts')}${metric('Avg energy',avg('Energy')+'/5','From daily check-ins')}${metric('Avg bloating',avg('Bloating')+'/5','Track patterns, not perfection')}
 <div class="card c12"><h3>Milestones</h3><div class="badges">${[7,14,21,30].map(n=>`<div class="milestone ${c>=n?'unlocked':'locked'}"><strong>Day ${n}</strong><div class="sub">${c>=n?'Unlocked ✓':'Keep going'}</div></div>`).join('')}</div></div>
 <div class="card c6"><h3>Weekly scorecards</h3>${[1,2,3,4,5].map((w,i)=>{let a=i*7+1,b=Math.min(30,a+6),done=state.fitDone.filter(x=>x>=a&&x<=b).length,total=b-a+1;return `<p>Week ${w}: <strong>${done}/${total}</strong></p><div class="progress"><i style="width:${pct(done,total)}%"></i></div>`}).join('')}</div>
 <div class="card c6"><h3>Day 30 assessment</h3><p class="sub">Compare, do not judge: push-up ability; plank time; hip-thrust/glute-bridge resistance; split-squat control; cardio endurance; energy; bloating; confidence; consistency.</p><p class="sub">Optional: waist measurement. Use the same conditions and remember short-term measurements can vary with hydration, digestion and cycle-related changes.</p><button class="btn" onclick="openFitDay(30)">Open Day 30 assessment</button></div></div>`;
}

document.addEventListener('click',e=>{if(!e.target.closest('#wordPopup'))wordPopup.classList.remove('show')});
ensurePreloadedBucketWords();
render();
</script>
