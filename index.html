<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Day Sprint</title>
<style>
:root{
  --bg:#f5f7f8;--card:#fff;--text:#12211b;--muted:#65746e;--line:#dde6e1;
  --green:#1f9d64;--green2:#dff7eb;--navy:#132d46;--blue:#eaf2fb;--warm:#fff3dc;
  --shadow:0 12px 32px rgba(18,33,27,.08);--radius:18px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body.fit{--bg:#f4f4f2;--card:#fff;--text:#111;--muted:#6d6d6d;--line:#dededb;--green:#111;--green2:#efefec;--navy:#111;--blue:#f0f0ee;--warm:#f7f2e8}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:20px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brandWrap{position:relative}
.brand{width:100%;display:grid;grid-template-columns:46px 1fr 18px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:10px;text-align:left}
.brand:hover{box-shadow:var(--shadow)}
.badge{height:42px;width:42px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:850;font-size:13px;letter-spacing:.4px}
.brand strong{display:block;font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.switchMenu{position:absolute;top:62px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:var(--shadow);display:none;z-index:40}
.switchMenu.open{display:block}
.switchMenu button{width:100%;border:0;background:transparent;padding:11px;border-radius:10px;text-align:left}
.switchMenu button:hover{background:var(--blue)}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:20px;overflow:auto;padding-bottom:20px}
.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#405149;font-weight:650}
.nav button.active,.nav button:hover{background:var(--green2);color:var(--text)}
.sideFooter{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted)}
.main{min-width:0;padding:28px 32px 52px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{margin:0;font-size:30px;letter-spacing:-.6px}.kicker{font-size:12px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.mobileMenu{display:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px}
.page{max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 14px rgba(0,0,0,.025);padding:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.metricLabel{font-size:12px;color:var(--muted);font-weight:700}.metric{font-size:28px;font-weight:850;margin-top:6px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
.progress{height:10px;background:#edf1ef;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:inherit}
.hero{padding:24px;background:linear-gradient(135deg,var(--navy),#214f70);color:#fff;border:0}.fit .hero{background:linear-gradient(135deg,#111,#333)}
.hero h2{font-size:28px;margin:8px 0}.hero p{max-width:700px;color:rgba(255,255,255,.8);line-height:1.6}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--green);color:#fff}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#9b2c2c}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--blue);font-size:12px;font-weight:750}
.weekTabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.weekTabs button,.dayChip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:750}.weekTabs button.active,.dayChip.active{background:var(--navy);color:#fff}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.dayChip{text-align:left;min-height:72px}.dayChip small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.dayChip.done{border-color:#75cfa3;background:#eefbf5}.dayChip.done small{color:#287850}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px}.sectionTitle h2,.sectionTitle h3{margin:0}
.lessonNav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.lessonSection{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.lessonSection h3{margin-top:0}.lessonSection p,.lessonSection li{line-height:1.65}.ruleTable{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}.ruleTable td,.ruleTable th{border-bottom:1px solid var(--line);padding:9px;text-align:left}
.quizQ{padding:14px 0;border-bottom:1px solid var(--line)}.option{display:block;width:100%;margin:7px 0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:left}.option.correct{border-color:#3aa773;background:#e8f8ef}.option.wrong{border-color:#d56a6a;background:#fff0f0}
.notice{border-left:4px solid var(--green);background:var(--green2);padding:12px 14px;border-radius:10px;font-size:13px}
.tip{border-left:4px solid #d69a2d;background:var(--warm);padding:12px 14px;border-radius:10px;font-size:13px}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}.fit textarea,.fit input{background:#fff}textarea:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}
textarea{min-height:110px;resize:vertical}
.bucketAdd{background:#102019;color:#fff;border-radius:20px;padding:20px}.fit .bucketAdd{background:#111}.bucketAdd input{margin:7px 0}
.wordRow{display:grid;grid-template-columns:1.1fr 1.3fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wordPopup{position:fixed;z-index:100;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 18px 42px rgba(0,0,0,.18);min-width:230px;max-width:320px;display:none}
.wordPopup.show{display:block}.wordPopup strong{font-size:18px}.wordPopup .meaning{color:var(--muted);margin:5px 0 12px}
.spanishZone{cursor:text}
.accordion{border:1px solid var(--line);border-radius:14px;margin:9px 0;background:#fff;overflow:hidden}.accHead{width:100%;display:flex;justify-content:space-between;border:0;background:#fff;padding:13px 14px;font-weight:800}.accBody{display:none;padding:0 14px 14px}.accordion.open .accBody{display:block}
.exercise{padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.exercise strong{display:block}.exercise small{color:var(--muted)}
.toggle{display:inline-flex;background:#ededeb;border-radius:12px;padding:3px}.toggle button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:800}.toggle button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.checkRow{display:grid;grid-template-columns:1fr repeat(4,58px);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.scoreBtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px}.scoreBtn.active{background:var(--navy);color:#fff}
.coverage{width:100%;border-collapse:collapse;font-size:13px}.coverage th,.coverage td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.coverage td:last-child{color:var(--muted)}
.badges{display:flex;gap:10px;flex-wrap:wrap}.milestone{padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff}.milestone.locked{opacity:.45}.milestone.unlocked{border-color:#9a9a96}
.flashcard{min-height:220px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fafcfb);font-size:28px;font-weight:850;padding:30px}
.miniChart{display:flex;align-items:flex-end;gap:8px;height:120px}.bar{flex:1;background:var(--green2);border-radius:7px 7px 2px 2px;position:relative}.bar i{position:absolute;bottom:0;left:0;right:0;background:var(--green);border-radius:inherit}.bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;width:268px;transition:.2s;box-shadow:18px 0 40px rgba(0,0,0,.12)}.sidebar.open{left:0}.mobileMenu{display:block}.main{padding:20px 16px}.c3,.c4,.c5,.c6,.c7,.c8{grid-column:1/-1}.daygrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.daygrid{grid-template-columns:repeat(2,1fr)}.topbar h1{font-size:24px}.wordRow{grid-template-columns:1fr}.main{padding:15px 11px}.card{padding:15px}.checkRow{grid-template-columns:1fr repeat(4,42px)}}

.selectionPanel{
  position:fixed;
  left:286px;
  bottom:22px;
  width:300px;
  z-index:120;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 18px 42px rgba(0,0,0,.16);
  padding:14px;
  display:none;
}
.selectionPanel.show{display:block}
.selectionPanel .selectedWord{font-size:18px;font-weight:850;margin-bottom:5px}
.selectionPanel .selectedMeaning{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:12px}
.selectionPanel .selectionHint{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:900px){
  .selectionPanel{left:12px;right:12px;bottom:12px;width:auto}
}


/* v4 interaction + readability fixes */

.hero .pill{

.fit .hero .pill{color:#111}
.lessonSection .sub,.lessonSection p.sub{color:#4b5b54}

.option{position:relative;z-index:5;cursor:pointer;user-select:none}

.skillAnswers button:disabled{opacity:1;cursor:default}
.skillFeedback{margin-top:10px;min-height:20px}

.vocabRevealBox{
  margin-top:16px;
  border:1px solid var(--line);

  border-radius:14px;
  padding:14px 16px;
}
.vocabRevealText{

}
.vocabToken.revealed{
  border-color:#1268cf !important;
  background:#edf5ff !important;

}


.nativeAudioWrap{
  margin-top:12px;

}

.notePattern{

}


.systemVoiceCard{
  border:1px solid var(--line);

}

.saveIndicator{margin-top:7px;font-size:12px;font-weight:750;color:var(--muted)}
.saveIndicator.saved{color:#237a50}
.writingFeedbackBox{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfc;min-height:44px}

.notebookList{display:grid;gap:14px}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brandWrap">
    <button class="brand" id="brandBtn"><span class="badge" id="brandBadge">B1</span><span><strong id="brandTitle">DELE B1 Sprint</strong><small id="brandSub">beginner → B1 intensive</small></span><span>⌄</span></button>
    <div class="switchMenu" id="switchMenu">
      <button onclick="switchProgram('dele')"><strong>DELE B1 Sprint</strong><small class="sub">beginner → B1 intensive</small></button>
      <button onclick="switchProgram('fitness')"><strong>30-Day Fitness</strong><small class="sub">strength · Pilates · conditioning</small></button>
      
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sideFooter"><strong>Offline-first</strong><br>Progress stays on this device via localStorage.</div>
</aside>
<main class="main">
  <div class="page">
    <div class="topbar"><div><div class="kicker" id="kicker">30-day intensive</div><h1 id="pageTitle">Home</h1></div><button class="mobileMenu" onclick="toggleSidebar()">☰ Menu</button></div>
    <div id="content"></div>
  </div>
</main>
</div>
<div class="wordPopup" id="wordPopup"></div>

<div class="selectionPanel" id="selectionPanel">
  <div class="selectedWord" id="selectedWord"></div>
  <div class="selectedMeaning" id="selectedMeaning"></div>
  <div class="btnrow">
    <button class="btn" id="selectionAddBtn">＋ Add to bucket</button>
    <button class="btn ghost" onclick="hideSelectionPanel()">Close</button>
  </div>
  <div class="selectionHint">Highlight a Spanish word or short phrase anywhere in the DELE app.</div>
</div>


<script src="config.js"></script>
<script>
const KEY='sprint30_state_v5';
const defaultState={
 program:'dele',page:'home',deleDay:1,fitDay:1,fitMode:'gym',deleDone:[],fitDone:[],xp:0,
 mistakes:{Reading:0,Listening:0,Writing:0,Speaking:0,Grammar:0,Vocabulary:0},
 concepts:{'ser vs estar':0,'por vs para':0,'past tense choice':0,'pronouns':0,'subjunctive':0,'prepositions':0,'connectors':0},
 bucket:[],bucketAttempts:0,bucketCorrect:0,teacherScores:[],fitChecks:{},fitLogs:{},quizScores:{},reviewed:{},listenAttempts:{},
 writingDrafts:{},writingHistory:[],activeRecall:{},speakingDrafts:{},speakingHistory:[],guidedAnswers:{}
};

const APP_RESET_VERSION='2026-07-23-reset-1';
if(localStorage.getItem('appResetVersion')!==APP_RESET_VERSION){
  const preserveKeys=['preferredSpanishVoice','preferredSpanishRate','deleAudioRate'];
  const preserved={};
  preserveKeys.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null)preserved[k]=v; });

  localStorage.clear();

  Object.entries(preserved).forEach(([k,v])=>localStorage.setItem(k,v));
  localStorage.setItem('appResetVersion',APP_RESET_VERSION);
}

let state=Object.assign({},defaultState,JSON.parse(localStorage.getItem(KEY)||'{}'));

state.mistakes=Object.assign({},defaultState.mistakes,state.mistakes||{});
state.concepts=Object.assign({},defaultState.concepts,state.concepts||{});

state.writingDrafts=state.writingDrafts||{};
state.writingHistory=Array.isArray(state.writingHistory)?state.writingHistory:[];
state.activeRecall=state.activeRecall||{};
state.speakingDrafts=state.speakingDrafts||{};
state.speakingHistory=Array.isArray(state.speakingHistory)?state.speakingHistory:[];

function deleStats(){
 const complete=state.deleDone.length, completion=pct(complete,30), totalMist=Object.values(state.mistakes).reduce((a,b)=>a+b,0);
 const weakest=Object.entries(state.mistakes).sort((a,b)=>b[1]-a[1])[0][0];
 const readiness=clamp(Math.round(completion*.65 + Math.max(0,35-totalMist)*.7),3,96);
 const g1=clamp(Math.round(12+completion*.28+(state.quizScores.writing||0)*.12+(state.quizScores.reading||0)*.12),12,48);
 const g2=clamp(Math.round(12+completion*.28+(state.quizScores.listening||0)*.12+(state.teacherScores.length?avgTeacher()*5:0)),12,48);
 return {complete,completion,weakest,readiness,g1,g2}
}
function avgTeacher(){if(!state.teacherScores.length)return 0;return state.teacherScores.reduce((a,s)=>a+(s.coherence+s.fluency+s.correction+s.range)/4,0)/state.teacherScores.length}
function streak(done){let s=0;for(let i=1;i<=30;i++){if(done.includes(i))s++;else break}return s}

function normalizeGuidedAnswer(value){
 return String(value||'')
  .toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[¿?¡!.,;:()"'’]/g,' ')
  .replace(/\s+/g,' ')
  .trim();
}

function setGuidedFeedback(id,correct,message){

function checkGuidedAnswers(d){
 const present=document.getElementById('guidedPresent-'+d)?.value||'';
 const past=document.getElementById('guidedPast-'+d)?.value||'';
 const connector=document.getElementById('guidedConnector-'+d)?.value||'';
 const reason=document.getElementById('guidedReason-'+d)?.value||'';

 saveGuidedField(d,'present',present);
 saveGuidedField(d,'past',past);
 saveGuidedField(d,'connector',connector);
 saveGuidedField(d,'reason',reason);

 const p=normalizeGuidedAnswer(present);
 const pa=normalizeGuidedAnswer(past);
 const c=normalizeGuidedAnswer(connector);
 const r=normalizeGuidedAnswer(reason);

 const presentAnswers=['vive','trabaja','quiere','intenta'];
 const pastAnswers=['ha empezado','empezado','fue','conocio','tenia'];
 const connectorAnswers=['porque','pero'];

 const presentOK=presentAnswers.some(x=>p===normalizeGuidedAnswer(x));
 const pastOK=pastAnswers.some(x=>pa===normalizeGuidedAnswer(x));
 const connectorOK=connectorAnswers.some(x=>c===normalizeGuidedAnswer(x));

 const reasonGroups=[
   ['quiere','aprender','nuevo'],
   ['aprender','algo','nuevo'],
   ['wants','learn','new'],
   ['wants','something','new'],
   ['learn','something','new']
 ];
 const reasonOK=reasonGroups.some(group=>group.filter(t=>r.includes(normalizeGuidedAnswer(t))).length>=2);

 setGuidedFeedback(
   'guidedPresentFeedback-'+d,
   presentOK,
   presentOK
    ?'Correct. That is a present-tense verb form from the passage.'
    :'Try again. Valid examples include vive, trabaja, quiere, or intenta.'
 );

 setGuidedFeedback(
   'guidedPastFeedback-'+d,
   pastOK,
   pastOK
    ?'Correct. That is a past-tense form from the passage.'
    :'Try again. Valid examples include ha empezado, fue, conoció, or tenía.'
 );

 setGuidedFeedback(
   'guidedConnectorFeedback-'+d,
   connectorOK,
   connectorOK
    ?'Correct. That connector links ideas in the passage.'
    :'Try again. The clearest connectors here are porque and pero.'
 );

 setGuidedFeedback(
   'guidedReasonFeedback-'+d,
   reasonOK,
   reasonOK
    ?'Correct. Lucía starts the photography course because she wants to learn something new.'
    :'Try again. Look at the clause after porque.'
 );

 const score=[presentOK,pastOK,connectorOK,reasonOK].filter(Boolean).length;
 const summary=`<strong>${score}/4 correct</strong>${score===4?' · Excellent.':' · Fix the red answers and check again.'}`;

 const summaryEl=document.getElementById('guidedSummary-'+d);
 if(summaryEl)summaryEl.innerHTML=summary;

 state.guidedAnswers[d]=state.guidedAnswers[d]||{};
 state.guidedAnswers[d].summary=summary;
 state.guidedAnswers[d].readingScore=score;
 save();
}

function playBundledClip(index,d){
 const clip=bundledListeningClips[index];
 if(!clip||!clip.dataUri){
   const status=document.getElementById('audioStatus-'+d);
   if(status)status.textContent='Embedded audio was not found.';
   return;
 }

}

function playBundledAudio(src,d){
 stopListeningAudio();
 state.listenAttempts[d]=(state.listenAttempts[d]||0)+1;
 save();

 lastAudioSrc=src;
 lastAudioDay=d;

 const status=document.getElementById('audioStatus-'+d);
 if(status)status.textContent='Loading embedded audio…'; console.log('Loading listening clip',d);

 const a=document.createElement('audio');
 activeAudio=a;
 a.preload='auto';
 a.volume=1;
 a.src=src;

 a.onloadeddata=()=>{if(status)status.textContent='Audio ready.';};
 a.onplaying=()=>{if(status)status.textContent='Playing…';};
 a.onended=()=>{
   if(status)status.textContent='Finished.';
   if(activeAudio===a)activeAudio=null;
 };
 a.onerror=()=>{
   if(status)status.textContent='This browser could not decode the embedded audio.';
   console.error('Embedded audio error',a.error);
   activeAudio=null;
 };

 try{
   const p=a.play();
   if(p&&typeof p.catch==='function'){
     p.catch(err=>{
       console.warn('Audio play failed',err);
       if(status)status.textContent='Playback was blocked. Click Play audio once more.';
     });
   }
 }catch(err){
   console.warn('Audio play failed',err);
   if(status)status.textContent='Playback failed: '+err.message;
 }
}
function replayBundledAudio(){
 if(!lastAudioSrc || !lastAudioDay){
   alert('Play the listening audio once first.');
   return;
 }
 playBundledAudio(lastAudioSrc,lastAudioDay);
}

let activeUtterance=null;
function speakText(txt,d){
 state.listenAttempts[d]=(state.listenAttempts[d]||0)+1;save();
 if(!('speechSynthesis' in window)){alert('Speech synthesis is not supported in this browser. Try Chrome or Safari.');return;}
 speechSynthesis.cancel();
 const play=()=>{
   const voices=speechSynthesis.getVoices();
   const esVoice=voices.find(v=>/^es(-|_)/i.test(v.lang)&&/Spain|España|Monica|Paulina|Jorge/i.test(v.name))
     || voices.find(v=>/^es(-|_)/i.test(v.lang)) || null;
   const u=new SpeechSynthesisUtterance(txt);
   u.lang=esVoice?esVoice.lang:'es-ES';
   if(esVoice)u.voice=esVoice;
   u.rate=.72;u.pitch=1;u.volume=1;
   activeUtterance=u;
   u.onerror=e=>console.warn('Speech synthesis error',e);
   speechSynthesis.speak(u);
 };
 if(speechSynthesis.getVoices().length)play();
 else{
   let fired=false;
   const once=()=>{if(fired)return;fired=true;speechSynthesis.onvoiceschanged=null;play()};
   speechSynthesis.onvoiceschanged=once;
   setTimeout(once,400);
 }
}
function stopListeningAudio(){
 if(activeAudio){
   try{activeAudio.pause();activeAudio.currentTime=0}catch(e){}
   activeAudio=null;
 }
 if('speechSynthesis' in window)speechSynthesis.cancel();
 activeUtterance=null;
}

function saveWritingDraft(d,text){state.writingDrafts[d]=text;save();}
function localWritingAssessment(text){
 const words=(text.trim().match(/\S+/g)||[]);
 const n=words.length;
 const connectors=(text.match(/\b(además|pero|porque|por eso|sin embargo|finalmente|primero|después|aunque|también|entonces)\b/gi)||[]);
 const sentences=(text.match(/[.!?]+/g)||[]).length;
 let score=clamp(Math.round((Math.min(n,100)/100)*50+Math.min(connectors.length,4)*8+Math.min(sentences,4)*4+10),10,95);
 const notes=[];
 if(n<80)notes.push('Develop the response more: the target is 80–110 words.');
 if(n>110)notes.push('Edit for concision: the target is 80–110 words.');
 if(connectors.length<2)notes.push('Add at least two connectors such as porque, además, pero, por eso, or sin embargo.');
 if(sentences<3)notes.push('Use clearer sentence boundaries so the response is easier to follow.');
 if(!/[¿¡áéíóúñ]/i.test(text))notes.push('Check Spanish accents and punctuation carefully.');
 if(!notes.length)notes.push('Good basic structure. Focus next on accuracy, richer vocabulary, and natural phrasing.');
 return {score,notes};
}

  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');
}

let speakingRecognition=null;
let speakingRecordingDay=null;

function saveSpeakingDraft(d,text){
 state.speakingDrafts[d]=text;
 save();
}

function startSpeakingRecording(d){
 speakingRecordingDay=d;
 const status=document.getElementById('recordingStatus-'+d);
 const box=document.getElementById('speak-'+d);

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
   if(status)status.textContent='Speech recognition is not available in this browser. Type your response in the box instead.';
   if(box)box.focus();
   return;
 }

 try{
   if(speakingRecognition) speakingRecognition.stop();
 }catch(e){}

 const rec=new SR();
 speakingRecognition=rec;
 rec.lang='es-ES';
 rec.continuous=true;
 rec.interimResults=true;

 let finalText=(state.speakingDrafts[d]||'').trim();
 let interim='';

 rec.onstart=()=>{
   if(status)status.textContent='● Recording in Spanish… speak naturally.';
   if(status)status.classList.add('recording');
 };

 rec.onresult=(event)=>{
   interim='';
   for(let i=event.resultIndex;i<event.results.length;i++){
     const t=event.results[i][0].transcript;
     if(event.results[i].isFinal){
       finalText+=(finalText?' ':'')+t.trim();
     }else{
       interim+=t;
     }
   }
   if(box){
     box.value=(finalText+(interim?' '+interim:'')).trim();
     state.speakingDrafts[d]=box.value;
     save();
   }
 };

 rec.onerror=(event)=>{
   if(status)status.textContent='Recording stopped. You can edit the transcript manually.';
   if(status)status.classList.remove('recording');
   console.warn('Speech recognition:',event.error);
 };

 rec.onend=()=>{
   if(box){
     state.speakingDrafts[d]=box.value;
     save();
   }

function localSpeakingAssessment(text){
 const words=(text.trim().match(/\S+/g)||[]);
 const n=words.length;
 const connectors=(text.match(/\b(además|pero|porque|por eso|sin embargo|primero|después|aunque|también|entonces|finalmente)\b/gi)||[]);
 const opinion=(text.match(/\b(creo que|pienso que|en mi opinión|para mí|prefiero|me parece)\b/gi)||[]);
 let score=clamp(Math.round(Math.min(n,90)/90*55 + Math.min(connectors.length,4)*7 + Math.min(opinion.length,2)*6 + 5),10,95);
 const notes=[];
 if(n<35)notes.push('Develop the answer more so you can demonstrate a wider range of B1 language.');
 if(connectors.length<2)notes.push('Use more connectors to organize the response naturally.');
 if(opinion.length<1)notes.push('Add a clear opinion or reaction when the task allows it.');
 if(!notes.length)notes.push('Good amount of language. Focus next on accuracy, natural phrasing, and smoother linking.');
 return {score,notes};
}

function normalizeWord(w){return w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'')}
function lookup(raw){
 let w=raw.toLowerCase().replace(/^[^\p{L}áéíóúüñ]+|[^\p{L}áéíóúüñ]+$/gu,'');
 if(dictionary[w])return dictionary[w];
 let plain=normalizeWord(w);for(let [k,v] of Object.entries(dictionary))if(normalizeWord(k)===plain)return v;
 if(w.endsWith('s')&&dictionary[w.slice(0,-1)])return dictionary[w.slice(0,-1)]+' (plural form)';
 if(w.endsWith('es')&&dictionary[w.slice(0,-2)])return dictionary[w.slice(0,-2)]+' (plural form)';
 if(w.endsWith('a')&&dictionary[w.slice(0,-1)+'o'])return dictionary[w.slice(0,-1)+'o']+' (feminine form)';
 if(w.endsWith('as')&&dictionary[w.slice(0,-2)+'o'])return dictionary[w.slice(0,-2)+'o']+' (feminine/plural form)';
 const reg=[['ando','ar','present participle of '],['iendo','er','present participle of '],['ado','ar','past participle of '],['ido','er','past participle of '],['amos','ar','we-form of '],['emos','er','we-form of '],['imos','ir','we-form of ']];
 for(let [end,inf,prefix] of reg)if(w.endsWith(end)){let root=w.slice(0,-end.length)+inf;if(dictionary[root])return prefix+root+' · '+dictionary[root]}
 return '';
}

 // Selection lookup never captures normal clicks, so quiz answers remain fully clickable.
 if(window.__selectionLookupBound)return;

async function showSelectionPanel(text){

 const meaningEl=document.getElementById('selectedMeaning');

 wordEl.textContent=text;

 add.classList.remove('added');
 add.textContent='＋ Add to bucket';
 add.disabled=true;
 panel.classList.add('show');

 // Groq is the primary translator. The offline dictionary is only a fallback.
 let meaning='';
 try{
   meaning=await aiTranslate(text);
 }catch(e){
   meaning='';
 }

 if(!meaning){
   meaning=lookupPhraseOrWord(text) || 'Meaning not found.';
   meaningEl.textContent=meaning+' · offline fallback';
 }else{
   meaningEl.textContent=meaning;

function lookupPhraseOrWord(text){
 const raw=text.trim().toLowerCase().replace(/^[^\p{L}áéíóúüñ]+|[^\p{L}áéíóúüñ]+$/gu,'');
 if(dictionary[raw]) return dictionary[raw];

 const simple=raw.replace(/[¿?¡!.,;:]+$/g,'').trim();
 if(dictionary[simple]) return dictionary[simple];

 if(!/\s/.test(simple)) return lookup(simple);

 const parts=simple.split(/\s+/);
 const glosses=parts.map(w=>({w,m:lookup(w)})).filter(x=>x.m);
 if(glosses.length===parts.length && glosses.length<=6){
   return glosses.map(x=>`${x.w} = ${x.m}`).join(' · ');
 }
 return '';
}

async function callAI(systemPrompt,userPrompt){
 const cfg=window.APP_CONFIG||{};
 const endpoint=(cfg.GROQ_ENDPOINT||'https://api.groq.com/openai/v1/chat/completions').trim();
 const apiKey=(cfg.GROQ_API_KEY||'').trim();
 const model=(cfg.GROQ_MODEL||'llama-3.3-70b-versatile').trim();

 if(!apiKey || apiKey==='PASTE_YOUR_GROQ_KEY_HERE'){
   alert('Groq AI is not configured yet. Open config.js and paste your Groq API key once.');
   return '';
 }

 try{
   const r=await fetch(endpoint,{
     method:'POST',
     headers:{
       'Content-Type':'application/json',
       'Authorization':'Bearer '+apiKey
     },
     body:JSON.stringify({
       model,
       messages:[
         {role:'system',content:systemPrompt},
         {role:'user',content:userPrompt}
       ],
       temperature:.2
     })
   });

   if(!r.ok){
     const detail=await r.text();
     throw new Error('Groq API '+r.status+(detail?' · '+detail.slice(0,180):''));
   }

   const data=await r.json();
   return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||'').trim();
 }catch(err){
   alert('Groq AI request failed: '+err.message);
   return '';
 }
}

}
